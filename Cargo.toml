[package]
name = "wee"
version = "0.1.0"
edition = "2024"

[dependencies]
wry = { version = "0.57", features = ["devtools"] }
tao = "0.37"
clap = { version = "4.5", features = ["derive"] }
notify = "8.0"
open = "5.3"
url = "2.5"
percent-encoding = "2.3"
mime_guess = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true


